name: autocare_ai
description: AutoCare AI Project
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  http: ^1.2.2
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^17.2.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  record: ^6.2.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    
flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/app_logo.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"

  min_sdk_android: 21

flutter_native_splash:
  color: "#F5F6FA"
  image: assets/images/app_logo.png

  android_12:
    color: "#F5F6FA"
    image: assets/images/app_logo.png

  android: true
  ios: true